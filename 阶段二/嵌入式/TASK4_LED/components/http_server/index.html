<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32-S3 LED Control</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #f5f5f5;
        }
        h1 { color: #333; }
        button {
            padding: 15px 30px;
            font-size: 18px;
            margin: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover { opacity: 0.8; }
        .on    { background: #4CAF50; color: white; }
        .off   { background: #f44336; color: white; }
        .apply { background: #2196F3; color: white; }
        input[type=range] {
            width: 80%;
            margin: 20px;
            height: 8px;
        }
        #val { font-weight: bold; color: #2196F3; font-size: 20px; }
    </style>
</head>
<body>
    <h1>ESP32-S3 LED Control</h1>

    <button class="on"  onclick="cmd('/led/on')">ON</button>
    <button class="off" onclick="cmd('/led/off')">OFF</button>

    <br><br>
    <label>Brightness: <span id="val">50</span>%</label><br>
    <input type="range" id="slider" min="0" max="100" value="50"
           oninput="document.getElementById('val').innerText = this.value">
    <br>
    <button class="apply" onclick="applySpeed()">Apply</button>

    <script>
        function applySpeed() {
            var v = document.getElementById('slider').value;
            cmd('/led/speed?value=' + v);
        }
        function cmd(url) {
            fetch(url)
                .then(r => r.text())
                .then(t => console.log(url + ' -> ' + t))
                .catch(e => console.error(url + ' ERROR: ' + e));
        }
    </script>
</body>
</html>
