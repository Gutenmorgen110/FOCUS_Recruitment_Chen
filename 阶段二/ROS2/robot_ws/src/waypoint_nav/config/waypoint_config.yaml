# 路点表。每三个数一组：x(m) y(m) yaw(rad)，坐标是 map 坐标系。
#
# 路线是照 finals_map 的自由空间挑的，四个点位置和朝向都不同：
#   P1 左屋南侧  -> P2 左屋中部（航向差约 63 度，明显转向）
#   -> P3 中段咽喉（离障碍仅 0.32 m，窄通道）
#   -> P4 右屋东北（掉头 180 度）
#
# 想改路线就改这串数，不用动代码。
waypoint_navigator:
  ros__parameters:
    # 机器人在 Gazebo 里的出生点，AMCL 靠它确定 map->odom
    initial_point: [0.0, 0.0, 0.0]

    target_points: [
      -1.0, -2.5,  0.0,      # P1 左屋南侧，朝东
       0.5,  0.0,  1.5708,   # P2 左屋中部，朝北
       4.5, -0.3,  0.0,      # P3 中段窄通道，朝东
      10.5,  1.5,  3.1416,   # P4 右屋东北，朝西
    ]
