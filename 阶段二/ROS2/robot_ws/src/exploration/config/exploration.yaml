# 自主探索节点参数
#
# 顶层 key 必须与节点名一致（launch 里 name='exploration'）。
# 改完这个文件不需要重新 colcon build，重新 launch 即可生效；
# 也可以在线改：ros2 param set /exploration d_stop 0.35
exploration:
  ros__parameters:
    use_sim_time: true

    # ---- 扇区几何（单位：度）----
    front_half_deg: 30.0       # 正前方扇区半宽
    side_center_deg: 90.0      # 左右扇区中心
    side_half_deg: 30.0        # 左右扇区半宽
    rear_half_deg: 15.0        # 后方守卫扇区半宽（倒车前必查）
    quantile: 0.15             # 扇区取 15% 分位，不用 min 以免被单点离群值带偏
    min_valid_ratio: 0.3       # 单个扇区有效 beam 占比下限
    frame_health_ratio: 0.1    # 整帧健康 beam 占比下限，低于则判定传感器失效
    n_close_trigger: 3         # 扇区内近于 d_stop 的 beam 数达此值即视为危险

    # ---- 速度 ----
    d_stop: 0.30               # 停车距离（m）
    d_slow: 1.20               # 开始减速的距离（m）
    v_max: 0.20                # 最大线速度（m/s）
    v_min: 0.05                # 最小线速度（m/s）
    k_speed: 0.22              # v = k*(front-d_stop)
    a_max: 0.50                # 线速度斜坡上限（m/s^2）
    w_turn: 0.80               # 转向角速度（rad/s）
    backup_speed: -0.08        # 后退速度（m/s）

    # ---- 状态机时序（单位：s）----
    min_turn_time: 0.40        # 最短转向时间，防抖动
    backup_time: 0.80          # 三面全堵时的后退时长
    turn_clear_margin: 0.15    # 前方超过 d_stop+此值才算转开（m）
    turn_prefer_margin: 0.25   # 换向时另一侧需明显更开阔（m）

    # ---- 卡死检测 ----
    t_stuck: 3.0               # 判据窗口（s）
    d_stuck: 0.15              # 窗口内位移小于此值判为卡死（m）
    yaw_stuck: 0.20            # 窗口内转角小于此值判为转向卡死（rad）
    stuck_v_eps: 0.05          # 线速度指令低于此值不做位移判据（m/s）
    stuck_w_eps: 0.20          # 角速度指令低于此值不做转角判据（rad/s）

    # ---- 脱困 ----
    recover_stop_time: 0.30    # 先停稳（s）
    recover_backup_time: 1.00  # 后退时长（s）
    recover_turn_max_time: 3.0 # 原地转的上限（s）
    recover_cooldown: 1.00     # 脱困结束后锁检测的时长（s）
    escalate_window: 10.0      # 统计升级次数的窗口（s）
    escalate_count: 3          # 窗口内脱困次数达此值则升级
    max_escalations: 2         # 升级到此级别仍失败则安全停机；设 0 表示永不停机
